name: 每日美韩科技行情增量日志
run-name: ${{ github.actor }} 行情采集任务
on:
  schedule:
    # cron 是 UTC 时间！北京时间 = UTC +8
    # 下面 cron：UTC 1:00 → 北京时间 09:00 工作日早9点执行（你原来想要的上午定时）
    # 周一到周五运行
    - cron: '0 1 * * 1,2,3,4,5'
  workflow_dispatch: # 支持网页手动点【运行】测试，非常重要！

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests
      - name: 执行行情脚本
        run: python fetch_report.py
      - name: 提交更新后的日志文件（增量存档）
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add tech_log.md
          git commit -m "auto update log ${{ github.sha }}" || echo "无变更无需提交"
          git push
